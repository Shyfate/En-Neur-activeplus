<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeurActiv Memory Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #f0f2f5;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #FF6B35;
            margin-bottom: 10px;
        }
        .game-container {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            gap: 10px;
            margin: 20px auto;
            max-width: 440px;
        }
        .card {
            width: 100px;
            height: 100px;
            background-color: #2D3748;
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .card.flipped {
            background-color: #FF6B35;
            transform: rotateY(180deg);
        }
        .matched {
            background-color: #38A169 !important;
            cursor: default;
        }
        #stats {
            margin: 20px 0;
            font-size: 18px;
        }
        button {
            background-color: #FF6B35;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #E53E3E;
        }
    </style>
</head>
<body>
    <h1>NeurActiv Memory Game</h1>
    <p>Match all pairs to test your brain power!</p>
    
    <div id="stats">
        Moves: <span id="moves">0</span> | 
        Pairs: <span id="pairs">0</span>/8
    </div>
    
    <div class="game-container" id="game"></div>
    <button onclick="resetGame()">Restart Game</button>

    <script>
        const emojis = ['💊', '🧠', '🔬', '💡', '⚗️', '🧪', '📊', '🖥️'];
        const cards = [...emojis, ...emojis]; // Duplicate for pairs
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            const game = document.getElementById('game');
            game.innerHTML = '';
            shuffle(cards).forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;
                card.dataset.emoji = emoji;
                card.innerHTML = '❓';
                card.addEventListener('click', flipCard);
                game.appendChild(card);
            });
        }

        function flipCard() {
            if (flippedCards.length < 2 && !this.classList.contains('flipped')) {
                this.classList.add('flipped');
                this.innerHTML = this.dataset.emoji;
                flippedCards.push(this);

                if (flippedCards.length === 2) {
                    moves++;
                    document.getElementById('moves').textContent = moves;
                    setTimeout(checkMatch, 500);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.dataset.emoji === card2.dataset.emoji) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                document.getElementById('pairs').textContent = matchedPairs;
                
                if (matchedPairs === 8) {
                    setTimeout(() => alert(`You won! 🎉\nMoves: ${moves}`), 300);
                }
            } else {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                card1.innerHTML = '❓';
                card2.innerHTML = '❓';
            }
            flippedCards = [];
        }

        function resetGame() {
            flippedCards = [];
            matchedPairs = 0;
            moves = 0;
            document.getElementById('moves').textContent = '0';
            document.getElementById('pairs').textContent = '0';
            createBoard();
        }

        // Start game
        createBoard();
    </script>
</body>
</html>
